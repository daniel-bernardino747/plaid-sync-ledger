name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tags can be moved).
jobs:
  verify:
    name: typecheck, lint, tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm init:env
      - run: pnpm db:up && pnpm db:migrate && pnpm --filter @psl/db seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  chaos:
    name: pnpm chaos
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm init:env
      - run: pnpm db:up && pnpm db:migrate
      - name: Run every chaos scenario
        run: pnpm chaos
      - name: Chaos table in the job summary
        if: always()
        run: cat docs/chaos-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the table and every process log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-results
          path: |
            docs/chaos-results.md
            .chaos/
          include-hidden-files: true

  contract-sandbox:
    name: contract suite against real Plaid Sandbox
    # Only where the repository owner configured Sandbox credentials as secrets.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run the contract suite against Sandbox
        run: |
          if [ -z "$PLAID_CLIENT_ID" ] || [ -z "$PLAID_SECRET" ]; then
            echo "::notice::PLAID_CLIENT_ID / PLAID_SECRET secrets not set; skipping the Sandbox contract suite."
            exit 0
          fi
          pnpm --filter @psl/plaid test:contract:sandbox
